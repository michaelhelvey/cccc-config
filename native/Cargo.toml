[package]
name = "cccc-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
publish = false
description = "C ABI over the cccc complexity engine, for use from bun:ffi"

[lib]
crate-type = ["cdylib"]

[dependencies]
# `cccc-cli` holds the registry of every bundled language (`lang::LANGUAGES`).
# Its library half is all we use; the clap CLI code is never called.
cccc-cli = { git = "https://github.com/moznion/cccc", rev = "c41f9eb8ab18d013f177728e5af2b59100e9dcc9" }
cccc-core = { git = "https://github.com/moznion/cccc", rev = "c41f9eb8ab18d013f177728e5af2b59100e9dcc9" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
